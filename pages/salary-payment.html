<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salary Payment — Greenfield High Portal</title>
<link rel="stylesheet" href="../assets/css/common.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/menu.js"></script>
<script src="../assets/js/common.js"></script>
<style>
  .due-box { padding:12px 16px; border-radius:var(--radius-md); background:var(--paper); border:1px solid var(--ink); margin:12px 0; }
  .due-box strong { font-size:1.2em; }
</style>
</head>
<body>
<div class="page-wrap enter-up">
  <div class="page-header">
    <span class="eyebrow">Staff & Salary</span>
    <h1>Salary Payment</h1>
  </div>

  <div class="card">
    <div class="field">
      <label for="pVoucher">Voucher no</label>
      <input class="input" id="pVoucher" />
      <div class="field-error" id="pVoucherErr">Voucher no is required.</div>
    </div>
    <div class="field">
      <label for="pDate">Date</label>
      <input class="input" id="pDate" type="date" />
    </div>
    <div class="field">
      <label for="pStaffSearch">Staff</label>
      <input class="input" id="pStaffSearch" placeholder="Type name to search..." autocomplete="off" />
      <div id="pStaffResults" style="border:1px solid var(--ink); border-radius:var(--radius-md); max-height:180px; overflow-y:auto; display:none;"></div>
      <input type="hidden" id="pStaffId" />
    </div>
    <div class="field">
      <label for="pMonth">Month</label>
      <input class="input" id="pMonth" type="month" />
    </div>

    <div class="due-box" id="dueBox" style="display:none;"></div>

    <div class="field">
      <label for="pAmount">Amount</label>
      <input class="input" id="pAmount" type="number" step="0.01" />
      <div class="field-error" id="pAmountErr">Amount is required.</div>
    </div>
    <div class="field">
      <label for="pDiscount">Discount (if any)</label>
      <input class="input" id="pDiscount" type="number" step="0.01" value="0" />
    </div>
    <div class="field">
      <label for="pMode">Mode</label>
      <select class="input" id="pMode">
        <option value="cash">Cash</option>
        <option value="bank">Bank</option>
        <option value="phonepe">PhonePe</option>
      </select>
    </div>
    <div class="field">
      <label for="pRemark">Remark (optional)</label>
      <input class="input" id="pRemark" />
    </div>

    <button class="btn btn-primary" id="pSaveBtn">Save payment</button>
  </div>

  <div class="card" style="margin-top:24px;">
    <div class="field">
      <input class="input" id="paySearch" placeholder="Search payments by voucher no or staff name..." />
    </div>
    <div id="payListArea"><div class="skeleton" style="height:18px"></div></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-stack"></div>

<script>
const PAGE_ID = "salary-payment";
let myAccess = null;
let staffCache = [];
let paymentsCache = [];
let selectedStaffMonthInfo = null;

function firstOfMonth(monthVal) { return monthVal + "-01"; } // monthVal = "YYYY-MM"

async function init() {
  myAccess = await getMyAccess(PAGE_ID);
  if (!myAccess.profile) return;

  const today = new Date();
  document.getElementById("pDate").value = today.toISOString().slice(0,10);
  document.getElementById("pMonth").value = today.toISOString().slice(0,7);

  const { data, error } = await supabaseClient.from("staff").select("staff_id, staff_name, staff_type, is_active").eq("is_active", true).order("staff_name");
  if (error) { showToast("Failed to load staff: " + error.message, "error"); }
  staffCache = data || [];

  document.getElementById("pStaffSearch").oninput = onStaffSearchInput;
  document.getElementById("pMonth").onchange = refreshDueBox;
  document.getElementById("pSaveBtn").onclick = savePayment;
  document.getElementById("paySearch").oninput = renderPaymentsList;

  await loadPaymentsList();
}

function onStaffSearchInput() {
  const q = document.getElementById("pStaffSearch").value.trim().toLowerCase();
  const resultsEl = document.getElementById("pStaffResults");
  if (!q) { resultsEl.style.display = "none"; return; }
  const matches = staffCache.filter(s => s.staff_name.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { resultsEl.innerHTML = `<div style="padding:8px;">No match.</div>`; resultsEl.style.display = "block"; return; }
  resultsEl.innerHTML = matches.map(s => `<div class="staff-opt" data-id="${s.staff_id}" data-name="${escapeHtml(s.staff_name)}" style="padding:8px;cursor:pointer;">${escapeHtml(s.staff_name)}</div>`).join("");
  resultsEl.style.display = "block";
  resultsEl.querySelectorAll(".staff-opt").forEach(el => {
    el.onclick = () => {
      document.getElementById("pStaffId").value = el.dataset.id;
      document.getElementById("pStaffSearch").value = el.dataset.name;
      resultsEl.style.display = "none";
      refreshDueBox();
    };
  });
}

async function refreshDueBox() {
  const staffId = document.getElementById("pStaffId").value;
  const monthVal = document.getElementById("pMonth").value;
  const dueBox = document.getElementById("dueBox");
  if (!staffId || !monthVal) { dueBox.style.display = "none"; selectedStaffMonthInfo = null; return; }

  const salaryMonth = firstOfMonth(monthVal);

  const [{ data: hist }, { data: adj }, { data: payments }] = await Promise.all([
    supabaseClient.from("staff_salary_history").select("*").eq("staff_id", staffId).lte("effective_month", salaryMonth).order("effective_month", { ascending: false }).limit(1),
    supabaseClient.from("salary_month_adjustments").select("*").eq("staff_id", staffId).eq("salary_month", salaryMonth).maybeSingle(),
    supabaseClient.from("salary_payments").select("*").eq("staff_id", staffId).eq("salary_month", salaryMonth)
  ]);

  const salary = hist && hist.length ? parseFloat(hist[0].salary_amount) : 0;
  const absentDays = adj ? parseFloat(adj.absent_days) : 0;
  const bonus = adj ? parseFloat(adj.bonus_amount) : 0;
  const collected = (payments || []).reduce((sum, p) => sum + parseFloat(p.amount) + parseFloat(p.discount), 0);
  const deduction = salary / 30 * absentDays;
  const netPayable = salary - deduction + bonus;
  const due = netPayable - collected;

  selectedStaffMonthInfo = { salaryMonth, salary, absentDays, bonus, deduction, netPayable, collected, due };

  dueBox.style.display = "block";
  dueBox.innerHTML = `
    Salary: ${salary.toFixed(2)} &nbsp; | &nbsp; Deduction: ${deduction.toFixed(2)} &nbsp; | &nbsp; Bonus: ${bonus.toFixed(2)}<br/>
    Net payable: ${netPayable.toFixed(2)} &nbsp; | &nbsp; Already collected: ${collected.toFixed(2)}<br/>
    <strong>Net due: ${due.toFixed(2)}</strong>
  `;
}

async function savePayment() {
  const voucherNo = document.getElementById("pVoucher").value.trim();
  const paymentDate = document.getElementById("pDate").value;
  const staffId = document.getElementById("pStaffId").value;
  const monthVal = document.getElementById("pMonth").value;
  const amount = parseFloat(document.getElementById("pAmount").value);
  const discount = parseFloat(document.getElementById("pDiscount").value) || 0;
  const mode = document.getElementById("pMode").value;
  const remark = document.getElementById("pRemark").value.trim();

  let hasError = false;
  document.getElementById("pVoucherErr").classList.toggle("show", !voucherNo);
  if (!voucherNo) hasError = true;
  document.getElementById("pAmountErr").classList.toggle("show", isNaN(amount));
  if (isNaN(amount)) hasError = true;
  if (!staffId) { showToast("Please select a staff member.", "error"); hasError = true; }
  if (!monthVal) { showToast("Please select a month.", "error"); hasError = true; }
  if (hasError) return;

  const btn = document.getElementById("pSaveBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const record = await withAuditStamp({
    voucher_no: voucherNo, payment_date: paymentDate, staff_id: staffId,
    salary_month: firstOfMonth(monthVal), amount, discount, mode, remark: remark || null
  }, { isNew: true });

  const { data, error } = await supabaseClient.from("salary_payments").insert(record).select().single();
  btn.disabled = false; btn.innerHTML = "Save payment";
  if (error) { showToast("Failed to save payment: " + error.message, "error"); return; }
  await logAudit("salary_payments", data.payment_id, "insert", null, record);
  showToast("Payment saved.", "success");

  document.getElementById("pVoucher").value = "";
  document.getElementById("pAmount").value = "";
  document.getElementById("pDiscount").value = "0";
  document.getElementById("pRemark").value = "";
  await refreshDueBox();
  await loadPaymentsList();
}

async function loadPaymentsList() {
  const { data, error } = await supabaseClient
    .from("salary_payments")
    .select("*, staff(staff_name)")
    .order("payment_date", { ascending: false })
    .limit(200);
  if (error) { showToast("Failed to load payments: " + error.message, "error"); return; }
  paymentsCache = data || [];
  renderPaymentsList();
}

function renderPaymentsList() {
  const q = document.getElementById("paySearch").value.trim().toLowerCase();
  const area = document.getElementById("payListArea");
  const filtered = paymentsCache.filter(p =>
    !q || p.voucher_no.toLowerCase().includes(q) || (p.staff?.staff_name || "").toLowerCase().includes(q)
  );
  if (!filtered.length) {
    area.innerHTML = `<div class="empty-state"><div class="icon">💰</div><p>No payments found.</p></div>`;
    return;
  }
  const canEdit = myAccess.level === "full";
  area.innerHTML = `
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Voucher</th><th>Date</th><th>Staff</th><th>Month</th><th>Amount</th><th>Discount</th><th>Mode</th>${canEdit ? "<th></th>" : ""}</tr></thead>
        <tbody>
          ${filtered.map(p => `
            <tr>
              <td>${escapeHtml(p.voucher_no)}</td>
              <td>${p.payment_date}</td>
              <td>${escapeHtml(p.staff?.staff_name || "-")}</td>
              <td>${p.salary_month.slice(0,7)}</td>
              <td>${parseFloat(p.amount).toFixed(2)}</td>
              <td>${parseFloat(p.discount).toFixed(2)}</td>
              <td>${p.mode}</td>
              ${canEdit ? `<td><button class="btn btn-danger btn-sm del-pay-btn" data-id="${p.payment_id}" data-voucher="${escapeHtml(p.voucher_no)}">Delete</button></td>` : ""}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  if (canEdit) {
    area.querySelectorAll(".del-pay-btn").forEach(btn => {
      btn.onclick = () => confirmDeletePayment(btn.dataset.id, btn.dataset.voucher);
    });
  }
}

function confirmDeletePayment(paymentId, voucherNo) {
  openModal({
    title: "Delete payment?",
    subtitle: "This cannot be undone.",
    bodyHtml: `<p>Delete voucher "<strong>${escapeHtml(voucherNo)}</strong>"?</p>`,
    footHtml: `<button class="btn btn-ghost" data-close>Cancel</button>
               <button class="btn btn-danger" id="confirmDelPayBtn">Delete</button>`,
    onOpen: () => {
      document.getElementById("confirmDelPayBtn").onclick = async () => {
        const { error } = await supabaseClient.from("salary_payments").delete().eq("payment_id", paymentId);
        if (error) { showToast("Delete failed: " + error.message, "error"); return; }
        await logAudit("salary_payments", paymentId, "delete", { voucher_no: voucherNo }, null);
        closeModal();
        showToast("Payment deleted.", "success");
        await loadPaymentsList();
        await refreshDueBox();
      };
    }
  });
}

init();
</script>
</body>
</html>
