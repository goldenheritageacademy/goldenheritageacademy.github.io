<script>
const PAGE_ID = "fee-due-report"; // must match menu.js id
let myAccess = null;
let lastStudentReport = null;
let lastClasswiseReport = null;
let lastDateRangeRows = []; // for export
let lastDateRangeMeta = null;
let lastMonthwiseRows = []; // for filter + export
let lastMonthwiseMeta = null; // { yy, mm }
let lastMonthwiseSummary = null;

const CLASS_LABELS = {
  "1":"Class 1","2":"Class 2","3":"Class 3",
  "4":"Class 4","5":"Class 5","6":"Class 6","7":"Class 7","8":"Class 8",
  "9":"Class 9","10":"Class 10","11-arts":"Class 11 - Arts","11-science":"Class 11 - Science",
  "12-arts":"Class 12 - Arts","12-science":"Class 12 - Science"
};
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* =====================================================================
   DUE-CALCULATION ENGINE (same logic as pages/fee-collection.html —
   kept duplicated on purpose since pages here are standalone modules)
   ===================================================================== */
function ymKey(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }
function addMonth(y,m){ m++; if (m>12){ m=1; y++; } return {y,m}; }
function monthsBetweenInclusive(y1,m1,y2,m2){
  const out = []; let y=y1, m=m1, guard=0;
  while ((y<y2 || (y===y2 && m<=m2)) && guard<600) {
    out.push({y,m});
    const n = addMonth(y,m); y=n.y; m=n.m; guard++;
  }
  return out;
}
function sessionForClass(klass, date = new Date()){
  const year = date.getFullYear();
  if(parseInt(klass,10)>=10){const start=date.getMonth()>=3?year:year-1;return `${start}-${String(start+1).slice(-2)}`;}
  return String(year);
}
function sessionMonths(klass, session){
  if(parseInt(klass,10)>=10){const start=Number(String(session).slice(0,4));return [...monthsBetweenInclusive(start,4,start,12),...monthsBetweenInclusive(start+1,1,start+1,3)];}
  const year=Number(session);return monthsBetweenInclusive(year,1,year,12);
}
function getAcademicWindow(klass, today){
  const year = today.getFullYear();
  if (["4","5","6","7","8","9"].includes(klass)) return monthsBetweenInclusive(year,1,year,12);
  if (klass === "10") return monthsBetweenInclusive(year,1,year,3);
  const ayStartYear = (today.getMonth()+1) >= 4 ? year : year-1;
  return monthsBetweenInclusive(ayStartYear,4, ayStartYear+1,3);
}
function getMonthlyRate(y,m, monthlyRatesSorted){
  const monthEnd = new Date(y, m, 0, 23,59,59);
  let rate = monthlyRatesSorted.length ? Number(monthlyRatesSorted[0].amount) : 0;
  for (const r of monthlyRatesSorted) {
    if (new Date(r.recorded_at) <= monthEnd) rate = Number(r.amount); else break;
  }
  return rate;
}
function computeMonthlyLedger(student, monthlyRates, monthlyReceipts, today){
  const monthlyRatesSorted = [...monthlyRates].sort((a,b)=> new Date(a.recorded_at)-new Date(b.recorded_at));
  const session = student.academic_session || sessionForClass(student.class,today);
  const allMonths = sessionMonths(student.class,session);
  const start = new Date(student.reactivated_at || student.admission_date);
  const end = (student.status === "deactivated" && student.deactivate_date) ? new Date(student.deactivate_date) : today;
  const sessionStart=new Date(allMonths[0].y,allMonths[0].m-1,1), activeStart=start>sessionStart?start:sessionStart;
  const billedEnd=end<today?end:today;
  const ledger = {}; let totalDue = 0, pool=0;
  for (const {y,m} of allMonths) {
    const rate = getMonthlyRate(y,m,monthlyRatesSorted);
    const billed=new Date(y,m,0)>=activeStart&&new Date(y,m-1,1)<=billedEnd;
    ledger[ymKey(y,m)]={y,m,rate,status:"inactive",due:0,paid:0,billed};
  }
  for(const r of monthlyReceipts.filter(r=>(r.target_session||session)===session)){
    let remaining=receiptTotal(r);const months=Array.isArray(r.for_months)?r.for_months:[];
    if(!months.length){pool+=remaining;continue;}
    for(const key of months){const mo=ledger[key];if(!mo||remaining<=0)continue;const applied=Math.min(mo.rate-mo.paid,remaining);mo.paid+=applied;remaining-=applied;}
  }
  for(const {y,m} of allMonths){
    const mo=ledger[ymKey(y,m)];
    if(mo.billed&&pool>0){const applied=Math.min(mo.rate-mo.paid,pool);mo.paid+=applied;pool-=applied;}
    mo.due=mo.billed?Math.max(0,mo.rate-mo.paid):0;
    mo.status=mo.due===0&&mo.paid>0?"paid":mo.paid>0?"partial":mo.billed?"due":"inactive";
    totalDue+=mo.due;
  }

  // Displayed months = the class's nominal session window UNIONED with
  // every month the student has actually been active for, so a month
  // with real due never gets dropped off the grid just because it falls
  // outside the nominal window (e.g. a Class 10 student still active
  // past March). Months before admission/reactivation and months after
  // today/deactivation are both simply "inactive".
  const nominal = getAcademicWindow(student.class, today);
  const seen = new Set(); const merged = [];
  [...nominal, ...allMonths].forEach(({y,m}) => {
    const k = ymKey(y,m);
    if (!seen.has(k)) { seen.add(k); merged.push({y,m,key:k}); }
  });
  merged.sort((a,b)=> a.y-b.y || a.m-b.m);

  const windowMonths = allMonths.map(({y,m})=>{const key=ymKey(y,m),l=ledger[key];return {y,m,key,label:`${MONTH_NAMES[m-1]} ${y}`,status:l.status,due:l.due};});

  const dueMonths = allMonths.map(({y,m})=>({ y,m,key:ymKey(y,m), ...ledger[ymKey(y,m)] }))
    .filter(mo => mo.status==="due" || mo.status==="partial");

  return { windowMonths, totalDue, ledgerByKey: ledger, dueMonths, start, end, session };
}
function computeAdmissionLedger(feeMasterRows, receipts){
  const charged = feeMasterRows.filter(r=>r.type==="admission"||r.type==="readmission")
    .reduce((s,r)=>s+Number(r.amount),0);
  const paid = receipts.reduce((s,r)=> s+Number(r.amount_cash)+Number(r.amount_bank)+Number(r.amount_phonepe)+Number(r.discount),0);
  return { charged, paid, due: Math.max(0, charged-paid) };
}
function getSessionDueBreakdown(student, feeMaster, receipts, today){
  const sessions=[...new Set([...(student.previous_sessions||[]),student.academic_session,
    ...feeMaster.map(r=>r.academic_session),...receipts.map(r=>r.target_session)].filter(Boolean))].sort();
  return sessions.map(session=>{
    const fm=feeMaster.filter(r=>!r.academic_session||r.academic_session===session);
    const rc=receipts.filter(r=>!r.target_session||r.target_session===session);
    const historical=session!==student.academic_session;
    const ledger=computeMonthlyLedger({...student,academic_session:session,
      reactivated_at:historical?null:student.reactivated_at,
      status:historical&&student.deactivate_date?"deactivated":student.status},fm.filter(r=>r.type==="monthly"),rc.filter(r=>r.fee_type==="monthly"),today);
    const admission=computeAdmissionLedger(fm,rc.filter(r=>r.fee_type==="admission_readmission"));
    return {session,monthlyDue:ledger.totalDue,admissionDue:admission.due,ledger};
  });
}
function money(n){ return "₹" + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function receiptTotal(r){ return Number(r.amount_cash)+Number(r.amount_bank)+Number(r.amount_phonepe)+Number(r.discount); }

/* =====================================================================
   PAGINATED FETCH HELPERS
   Supabase/PostgREST silently returns at most 1000 rows per request.
   Any report that loads many students' receipts in one call was getting
   a truncated list, so some students' payments were missing and their
   paid months showed as "Due". These helpers always pull every row.
   ===================================================================== */
async function fetchAll(makeQuery, pageSize = 1000) {
  let all = [], from = 0;
  while (true) {
    const { data, error } = await makeQuery().range(from, from + pageSize - 1);
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
// Loads all rows of `table` for the given reg numbers: chunked so the
// .in() URL stays short, and paginated inside each chunk.
async function fetchByRegNos(table, regNos, chunkSize = 50) {
  const chunks = [];
  for (let i = 0; i < regNos.length; i += chunkSize) chunks.push(regNos.slice(i, i + chunkSize));
  const parts = await Promise.all(chunks.map(ch => fetchAll(() =>
    supabaseClient.from(table).select("*").in("student_reg_no", ch)
      .order("student_reg_no", { ascending: true })
      .order("recorded_at", { ascending: true }))));
  return parts.flat();
}

/* =====================================================================
   INIT
   ===================================================================== */
async function init() {
  myAccess = await getMyAccess(PAGE_ID);
  if (!myAccess.profile) return;

  const classOptions = Object.entries(CLASS_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  document.getElementById("cClass").insertAdjacentHTML("beforeend", classOptions);
  document.getElementById("dClass").insertAdjacentHTML("beforeend", classOptions);
  document.getElementById("mMonth").value = new Date().toISOString().slice(0,7);
  const today = new Date();
  document.getElementById("dStart").value = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0,10);
  document.getElementById("dEnd").value = today.toISOString().slice(0,10);

  document.querySelectorAll(".fr-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".fr-tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".fr-panel").forEach(p=>p.classList.remove("show"));
      btn.classList.add("active");
      document.getElementById("tab-"+btn.dataset.tab).classList.add("show");
    });
  });

  document.getElementById("sSearchBtn").addEventListener("click", studentSearch);
  document.getElementById("sSearch").addEventListener("keydown", e=>{ if(e.key==="Enter") studentSearch(); });
  document.getElementById("sExportExcelBtn").addEventListener("click", exportStudentExcel);
  document.getElementById("sExportPdfBtn").addEventListener("click", exportStudentPDF);
  document.getElementById("cGenBtn").addEventListener("click", generateClasswise);
  document.getElementById("cExportExcelBtn").addEventListener("click", exportClasswiseExcel);
  document.getElementById("cExportPdfBtn").addEventListener("click", exportClasswisePDF);
  document.getElementById("mGenBtn").addEventListener("click", generateMonthwise);
  document.getElementById("mStatusFilter").addEventListener("change", renderMonthwiseTable);
  document.getElementById("mExportExcelBtn").addEventListener("click", exportMonthwiseExcel);
  document.getElementById("mExportPdfBtn").addEventListener("click", exportMonthwisePDF);
  document.getElementById("dGenBtn").addEventListener("click", generateDateRange);
  document.getElementById("dExportBtn").addEventListener("click", exportDateRange);
  document.getElementById("dExportPdfBtn").addEventListener("click", exportDateRangePDF);
}

/* =====================================================================
   STUDENT TAB
   ===================================================================== */
async function studentSearch() {
  const term = document.getElementById("sSearch").value.trim();
  const pickArea = document.getElementById("sPickArea");
  lastStudentReport = null;
  pickArea.innerHTML = "";
  document.getElementById("sResultArea").innerHTML = "";
  if (!term) { showToast("Type something to search.", "error"); return; }

  const { data, error } = await supabaseClient.from("student_master").select("*")
    .or(`reg_no.ilike.%${term}%,name.ilike.%${term}%,mobile_no.ilike.%${term}%`).limit(20);
  if (error) { showToast("Search failed: " + error.message, "error"); return; }
  if (!data || data.length === 0) { showToast("No student found.", "error"); return; }
  if (data.length === 1) { await showStudentReport(data[0]); return; }

  pickArea.innerHTML = `<p style="margin-top:10px;">${data.length} matches — pick one:</p>
    <div class="fr-pick-list">${data.map(s=>`
      <div class="fr-pick-item">
        <span>${escapeHtml(s.name)} — ${escapeHtml(s.reg_no)} — ${escapeHtml(CLASS_LABELS[s.class]||s.class)} — ${escapeHtml(s.mobile_no)}</span>
        <button class="btn btn-ghost btn-sm" data-reg="${escapeHtml(s.reg_no)}">Select</button>
      </div>`).join("")}</div>`;
  pickArea.querySelectorAll("button[data-reg]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const s = data.find(x=>x.reg_no===btn.dataset.reg);
      await showStudentReport(s);
    });
  });
}

async function showStudentReport(student) {
  document.getElementById("sPickArea").innerHTML = "";
  const resultArea = document.getElementById("sResultArea");
  resultArea.innerHTML = `<div class="skeleton" style="height:18px"></div>`;

  const [{ data: feeMaster }, { data: receipts }, { data: categories }] = await Promise.all([
    supabaseClient.from("fee_master").select("*").eq("student_reg_no", student.reg_no),
    supabaseClient.from("fee_receipts").select("*").eq("student_reg_no", student.reg_no).order("recorded_at", { ascending: false }),
    supabaseClient.from("fee_categories").select("*")
  ]);

  const breakdown=getSessionDueBreakdown(student,feeMaster||[],receipts||[],new Date());
  const selectedSession=student.academic_session||sessionForClass(student.class);
  const monthlyRates = (feeMaster||[]).filter(r=>r.type==="monthly"&&(!r.academic_session||r.academic_session===selectedSession));
  const monthlyReceipts = (receipts||[]).filter(r=>r.fee_type==="monthly"&&(!r.target_session||r.target_session===selectedSession));
  const admissionReceipts = (receipts||[]).filter(r=>r.fee_type==="admission_readmission"&&(!r.target_session||r.target_session===selectedSession));
  const otherReceipts = (receipts||[]).filter(r=>r.fee_type==="other");

  const today = new Date();
  const mLed = computeMonthlyLedger({...student,academic_session:selectedSession}, monthlyRates, monthlyReceipts, today);
  const aLed = computeAdmissionLedger((feeMaster||[]).filter(r=>!r.academic_session||r.academic_session===selectedSession), admissionReceipts);
  const previousDue=breakdown.filter(row=>row.session!==selectedSession&&(row.monthlyDue+row.admissionDue)>0);
  const previousTotal=previousDue.reduce((sum,row)=>sum+row.monthlyDue+row.admissionDue,0);
  const otherTotal = otherReceipts.reduce((s,r)=>s+receiptTotal(r),0);
  lastStudentReport = { student, selectedSession, monthlyLedger:mLed, admissionLedger:aLed,
    previousDue, previousTotal, otherTotal, receipts:receipts||[], categories:categories||[] };

  resultArea.innerHTML = `
    <div class="fr-student-card">
      <div><b>${escapeHtml(student.name)}</b> (${escapeHtml(student.reg_no)}) — ${escapeHtml(CLASS_LABELS[student.class]||student.class)} · Session ${escapeHtml(selectedSession)}<br/>
      Father: ${escapeHtml(student.father_name)} • Mobile: ${escapeHtml(student.mobile_no)}</div>
      <div>${statusBadge(student.status)}</div>
    </div>

    <div class="fr-cards">
      <div class="fr-card ${mLed.totalDue>0?'warn':'ok'}"><div class="label">Monthly Due</div><div class="value">${money(mLed.totalDue)}</div></div>
      <div class="fr-card ${aLed.due>0?'warn':'ok'}"><div class="label">Admission/Readm. Due</div><div class="value">${money(aLed.due)}</div></div>
      <div class="fr-card"><div class="label">Other Fee Received</div><div class="value">${money(otherTotal)}</div></div>
      <div class="fr-card warn"><div class="label">Total Due (all)</div><div class="value">${money(mLed.totalDue+aLed.due+previousTotal)}</div></div>
      <div class="fr-card ${previousTotal>0?'warn':'ok'}"><div class="label">Previous Session Due</div><div class="value">${money(previousTotal)}</div></div>
    </div>

    ${previousDue.length?`<h4>Previous Session Balances</h4><div class="table-wrap"><table class="data">
      <thead><tr><th>Session</th><th class="num">Monthly Due</th><th class="num">Admission Due</th><th class="num">Total Due</th></tr></thead>
      <tbody>${previousDue.map(row=>`<tr><td>${escapeHtml(row.session)}</td><td class="num">${money(row.monthlyDue)}</td>
      <td class="num">${money(row.admissionDue)}</td><td class="num">${money(row.monthlyDue+row.admissionDue)}</td></tr>`).join("")}</tbody></table></div>`:""}

    <h4>Monthly Fee — ${CLASS_LABELS[student.class]||student.class} · Session ${escapeHtml(selectedSession)}</h4>
    <div class="month-grid">${mLed.windowMonths.map(mo=>`

function receiptTypeLabel(receipt) {
  return receipt.fee_type==="admission_readmission" ? "Admission/Readm."
    : receipt.fee_type ? receipt.fee_type[0].toUpperCase()+receipt.fee_type.slice(1) : "";
}
function receiptDetail(receipt, categories) {
  if (receipt.fee_type==="monthly") return (receipt.for_months||[]).join(", ");
  if (receipt.fee_type==="other") return categories.find(c=>c.category_id===receipt.category_id)?.name || "—";
  return "—";
}
function safeFilePart(value) {
  return String(value||"").replace(/[^a-z0-9_-]+/gi, "_").replace(/^_+|_+$/g, "") || "report";

async function generateMonthwise() {
  const val = document.getElementById("mMonth").value; // "YYYY-MM"
  if (!val) { showToast("Pick a month.", "error"); return; }
  const [yy, mm] = val.split("-").map(Number);
  const resultArea = document.getElementById("mResultArea");
  lastMonthwiseMeta = null;
  lastMonthwiseSummary = null;
  lastMonthwiseRows = [];
  resultArea.innerHTML = `<div class="skeleton" style="height:18px"></div>`;

  let students, feeMaster, receipts;
  try {
    students = await fetchAll(() => supabaseClient.from("student_master").select("*").order("reg_no", { ascending: true }));
    const regNos = students.map(s=>s.reg_no);
    [feeMaster, receipts] = await Promise.all([
      fetchByRegNos("fee_master", regNos),
      fetchByRegNos("fee_receipts", regNos)
    ]);
  } catch (error) { resultArea.innerHTML = `<div class="field-error show">${escapeHtml(error.message)}</div>`; return; }

  const today = new Date();
  const key = ymKey(yy,mm);
  const dueRows = [];
  let totalDueThisMonth = 0, totalPaidThisMonth = 0;

  for (const s of students) {
    const fm = (feeMaster||[]).filter(r=>r.student_reg_no===s.reg_no);
    const studentReceipts=(receipts||[]).filter(r=>r.student_reg_no===s.reg_no);
    const sessionLedgers=getSessionDueBreakdown(s,fm,studentReceipts,today);
    const entry=sessionLedgers.map(row=>row.ledger.ledgerByKey[key]).find(Boolean);
    if (!entry) continue; // month not in this student's active range at all -> not applicable, skip from table
    dueRows.push({ s, status: entry.status, due: entry.due, rate: entry.rate });
    if (entry.status === "due" || entry.status === "partial") totalDueThisMonth += entry.due;
    if (entry.status === "paid") totalPaidThisMonth += entry.rate;
    if (entry.status === "partial") totalPaidThisMonth += (entry.rate - entry.due);
  }

  // Collections actually recorded during this calendar month (any fee type)
  const monthStart = new Date(yy, mm-1, 1);
  const monthEnd = new Date(yy, mm, 0, 23,59,59);
  const collected = (receipts||[]).filter(r=>{
    const d = new Date(r.recorded_at);
    return d >= monthStart && d <= monthEnd;
  });
  const byType = { monthly:0, admission_readmission:0, other:0 };
  let cashSum=0, bankSum=0, phonepeSum=0, discountSum=0;
  collected.forEach(r=>{
    byType[r.fee_type] += receiptTotal(r);
    cashSum += Number(r.amount_cash); bankSum += Number(r.amount_bank);
    phonepeSum += Number(r.amount_phonepe); discountSum += Number(r.discount);
  });
  const grandCollected = cashSum+bankSum+phonepeSum+discountSum;

  lastMonthwiseRows = dueRows;
  lastMonthwiseMeta = { yy, mm };
  lastMonthwiseSummary = { totalDueThisMonth, totalPaidThisMonth, byType, cashSum, bankSum, phonepeSum, discountSum, grandCollected };

  resultArea.innerHTML = `
    <h4>Due Status for ${MONTH_NAMES[mm-1]} ${yy}</h4>
    <div class="fr-cards">
      <div class="fr-card warn"><div class="label">Due this month</div><div class="value">${money(totalDueThisMonth)}</div></div>
      <div class="fr-card ok"><div class="label">Paid for this month</div><div class="value">${money(totalPaidThisMonth)}</div></div>
    </div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Reg No</th><th>Name</th><th>Class</th><th>Status</th><th class="num">Amount Due</th></tr></thead>
      <tbody id="mDueTableBody"></tbody>
    </table></div>

    <h4 style="margin-top:24px;">Amount Collected During ${MONTH_NAMES[mm-1]} ${yy}</h4>
    <div class="fr-cards">
      <div class="fr-card"><div class="label">Monthly</div><div class="value">${money(byType.monthly)}</div></div>
      <div class="fr-card"><div class="label">Admission/Readm.</div><div class="value">${money(byType.admission_readmission)}</div></div>
      <div class="fr-card"><div class="label">Other</div><div class="value">${money(byType.other)}</div></div>
      <div class="fr-card ok"><div class="label">Total Collected</div><div class="value">${money(grandCollected)}</div></div>
    </div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Cash</th><th>Bank</th><th>PhonePe</th><th>Discount</th></tr></thead>
      <tbody><tr><td class="num">${money(cashSum)}</td><td class="num">${money(bankSum)}</td>
        <td class="num">${money(phonepeSum)}</td><td class="num">${money(discountSum)}</td></tr></tbody>
    </table></div>
  `;
  renderMonthwiseTable();
}

  resultArea.innerHTML = `<div class="skeleton" style="height:18px"></div>`;

  // Filter by Fee Receive Date (not the entry/recorded timestamp)
  const nextDay = new Date(end+"T00:00:00"); nextDay.setDate(nextDay.getDate()+1);
  const endExclusive = nextDay.getFullYear()+"-"+String(nextDay.getMonth()+1).padStart(2,"0")+"-"+String(nextDay.getDate()).padStart(2,"0");
  const startIso = new Date(start+"T00:00:00").toISOString();
  const endIso = nextDay.toISOString();

  let data;
  try {
    data = await fetchAll(() => {
      let q = supabaseClient.from("fee_receipts").select("*, student_master(name, class, academic_session)")
        .or(`and(received_date.gte.${start},received_date.lt.${endExclusive}),and(received_date.is.null,recorded_at.gte.${startIso},recorded_at.lt.${endIso})`)
        .order("received_date", { ascending: false, nullsFirst: false }).order("recorded_at", { ascending: false }).order("student_reg_no", { ascending: true });
      if (feeType) q = q.eq("fee_type", feeType);
      return q;
    });
  } catch (error) { resultArea.innerHTML = `<div class="field-error show">${escapeHtml(error.message)}</div>`; return; }

  let rows = data || [];
  if (klass) rows = rows.filter(r => r.student_master && r.student_master.class === klass);

  const { data: categories } = await supabaseClient.from("fee_categories").select("*");
  lastDateRangeRows = rows.map(r => ({
    ...r,
    student_name: r.student_master ? r.student_master.name : "",
    student_class: r.student_master ? r.student_master.class : "",
    student_session: r.target_session || (r.student_master && r.student_master.academic_session) || "",
    category_name: r.fee_type==="other" ? (categories.find(c=>c.category_id===r.category_id)?.name || "") : ""
  }));
  lastDateRangeMeta = { start, end, feeType, klass };

  const totals = lastDateRangeRows.reduce((acc,r)=>{
    acc.cash += Number(r.amount_cash); acc.bank += Number(r.amount_bank);
    acc.phonepe += Number(r.amount_phonepe); acc.discount += Number(r.discount);
    return acc;
  }, { cash:0, bank:0, phonepe:0, discount:0 });
  const grand = totals.cash+totals.bank+totals.phonepe+totals.discount;

  resultArea.innerHTML = `
    <div class="fr-cards">
      <div class="fr-card"><div class="label">Receipts</div><div class="value">${lastDateRangeRows.length}</div></div>
      <div class="fr-card ok"><div class="label">Total Collected</div><div class="value">${money(grand)}</div></div>
      <div class="fr-card"><div class="label">Cash / Bank / PhonePe</div><div class="value" style="font-size:.95em;">${money(totals.cash)} / ${money(totals.bank)} / ${money(totals.phonepe)}</div></div>
    </div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Date</th><th>Reg No</th><th>Name</th><th>Class</th><th>Session</th><th>Type</th><th>Detail</th>
        <th class="num">Cash</th><th class="num">Bank</th><th class="num">PhonePe</th><th class="num">Discount</th><th>Remark</th></tr></thead>
      <tbody>${lastDateRangeRows.length ? lastDateRangeRows.map(r=>{
        const detail = r.fee_type==="monthly" ? (r.for_months||[]).join(", ") : r.fee_type==="other" ? r.category_name : "—";
        return `<tr><td>${receivedDateLabel(r)}</td><td>${escapeHtml(r.student_reg_no)}</td>
        <td>${escapeHtml(r.student_name)}</td><td>${escapeHtml(CLASS_LABELS[r.student_class]||r.student_class)}</td><td>${escapeHtml(r.student_session)}</td>
        <td>${r.fee_type==="admission_readmission"?"Admission/Readm.":r.fee_type[0].toUpperCase()+r.fee_type.slice(1)}</td>
        <td>${escapeHtml(detail)}</td>
        <td class="num">${money(r.amount_cash)}</td><td class="num">${money(r.amount_bank)}</td>
        <td class="num">${money(r.amount_phonepe)}</td><td class="num">${money(r.discount)}</td>
        <td>${escapeHtml(r.remark||"")}</td></tr>`;
      }).join("") : `<tr>      <td colspan="12">No receipts in this range.</td></tr>`}</tbody>
    </table></div>
  `;
}

function exportDateRange() {
  if (!lastDateRangeMeta) { showToast("Generate a report first.", "error"); return; }
  const { start, end, feeType, klass } = lastDateRangeMeta;
  const totals = getDateRangeTotals();
  const aoa = [["Date","Reg No","Name","Class","Session","Type","Detail","Cash","Bank","PhonePe","Discount","Remark"]];
  lastDateRangeRows.forEach(r=>{
    const detail = r.fee_type==="monthly" ? (r.for_months||[]).join(", ") : r.fee_type==="other" ? r.category_name : "";
    aoa.push([
      receivedDateLabel(r), r.student_reg_no, r.student_name, CLASS_LABELS[r.student_class]||r.student_class, r.student_session,
      receiptTypeLabel(r), detail, Number(r.amount_cash||0), Number(r.amount_bank||0), Number(r.amount_phonepe||0), Number(r.discount||0), r.remark||""
    ]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ["Date Range Collection Report"], ["From",start], ["To",end],
    ["Fee Type",feeType||"All types"], ["Class",klass ? (CLASS_LABELS[klass]||klass) : "All classes"],
    ["Receipts",lastDateRangeRows.length], ["Total Collected",totals.grand],
    ["Cash",totals.cash], ["Bank",totals.bank], ["PhonePe",totals.phonepe], ["Discount",totals.discount]
  ]), "Summary");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Receipts");
  XLSX.writeFile(wb, `fee_collection_${start}_to_${end}.xlsx`);
}

function getDateRangeTotals() {
  const totals = lastDateRangeRows.reduce((acc,r)=>{
    acc.cash += Number(r.amount_cash||0); acc.bank += Number(r.amount_bank||0);
    acc.phonepe += Number(r.amount_phonepe||0); acc.discount += Number(r.discount||0);
    return acc;
  }, {cash:0,bank:0,phonepe:0,discount:0});
  totals.grand = totals.cash+totals.bank+totals.phonepe+totals.discount;
  return totals;
}

function exportDateRangePDF() {
  if (!lastDateRangeMeta) { showToast("Generate a report first.", "error"); return; }
  const { start, end, feeType, klass } = lastDateRangeMeta;
  const totals = getDateRangeTotals();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"landscape"});
  doc.setFontSize(14);
  doc.text("Date Range Collection Report", 14, 16);
  doc.setFontSize(10);
  doc.text(`From ${start} to ${end} | ${feeType||"All types"} | ${klass ? (CLASS_LABELS[klass]||klass) : "All classes"}`, 14, 22);
  doc.autoTable({
    startY:28,
    head:[["Receipts","Total Collected","Cash","Bank","PhonePe","Discount"]],
    body:[[String(lastDateRangeRows.length),money(totals.grand),money(totals.cash),money(totals.bank),money(totals.phonepe),money(totals.discount)]],
    styles:{fontSize:8}, headStyles:{fillColor:[176,141,87]}
  });
  doc.autoTable({
    startY:doc.lastAutoTable.finalY+8,
    head:[["Date","Reg No","Name","Class","Session","Type","Detail","Cash","Bank","PhonePe","Discount","Remark"]],
    body:lastDateRangeRows.length ? lastDateRangeRows.map(r=>[
      receivedDateLabel(r),r.student_reg_no,r.student_name,CLASS_LABELS[r.student_class]||r.student_class,
      r.student_session,receiptTypeLabel(r),
      r.fee_type==="monthly" ? (r.for_months||[]).join(", ") : r.fee_type==="other" ? r.category_name : "—",
      money(r.amount_cash),money(r.amount_bank),money(r.amount_phonepe),money(r.discount),r.remark||""
    ]) : [["—","No receipts in this range","","","","","","","","","",""]],
    styles:{fontSize:7}, headStyles:{fillColor:[176,141,87]}
  });
  doc.save(`fee_collection_${start}_to_${end}.pdf`);
}

init();
</script>
</body>
