function classShort(k) { return (CLASS_LABELS[k] || k).replace(/^Class\s*/, ""); }

const CLASS_LABELS = {
  "1":"Class 1","2":"Class 2","3":"Class 3","4":"Class 4","5":"Class 5","6":"Class 6","7":"Class 7",
  "8":"Class 8","9":"Class 9","10":"Class 10","11-arts":"Class 11 - Arts","11-science":"Class 11 - Science",
  "12-arts":"Class 12 - Arts","12-science":"Class 12 - Science"
};

/* ===== GRADE SCALE (same as app.py) ===== */
const GRADE_SCALE = [
  [90, "AA", "Outstanding"], [80, "A+", "Excellent"], [60, "A", "Very Good"], [45, "B+", "Good"],
  [35, "B", "Satisfactory"], [25, "C", "Marginal"], [0, "D", "Disqualified"]
];
function gradeAndRemark(pct) {
  pct = Math.max(0, Math.min(100, pct));
  for (const [low, g, r] of GRADE_SCALE) if (pct >= low) return [g, r];
  return ["D", "Disqualified"];
}
const n1 = v => Math.round(v * 10) / 10;
const show = v => (typeof v === "number" ? String(n1(v)) : String(v));

let exams = [], settings = {}, subjects = [], students = [], records = [], examObj = null, incomplete = [];

async function init() {
  myAccess = await getMyAccess(PAGE_ID);
  if (!myAccess.profile) return;
  $("rClass").innerHTML = Object.entries(CLASS_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  const { data } = await sb().from("result_exams").select("*").order("created_at", { ascending: false });
  exams = data || [];
  $("rExam").innerHTML = exams.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join("") || '<option value="">No exams</option>';
  $("rExam").addEventListener("change", syncPublish);
  $("rLoad").addEventListener("click", prepare);
  $("rSavePub").addEventListener("click", savePublish);
  $("rAllPdf").addEventListener("click", () => downloadSheets(records, `MarkSheets_${tag()}.pdf`));
  $("rRankPdf").addEventListener("click", downloadRankList);
  $("rLedger").addEventListener("click", exportLedger);
  syncPublish();
}
const tag = () => `${(examObj?.name || "Exam").replace(/\W+/g, "_")}_Class_${$("rClass").value}`;

function syncPublish() {
  const e = exams.find(x => x.id === $("rExam").value);
  $("rPublish").value = e?.publish_date || new Date().toISOString().slice(0, 10);
}
async function savePublish() {
  const id = $("rExam").value; if (!id) return;
  const { error } = await sb().from("result_exams").update({ publish_date: $("rPublish").value || null }).eq("id", id);
  if (error) { showToast(error.message, "error"); return; }
  exams.find(x => x.id === id).publish_date = $("rPublish").value;
  showToast("Publish date saved.", "success");
}

/* ===================== PREPARE / CALCULATE ===================== */
async function prepare() {
  const examId = $("rExam").value, klass = $("rClass").value;
  if (!examId) { showToast("Select an exam.", "error"); return; }
  examObj = exams.find(e => e.id === examId);
  $("rTable").innerHTML = '<div class="skeleton" style="height:18px"></div>';
  const [st, su, mk, se] = await Promise.all([
    sb().from("student_master").select("reg_no,name,roll_no,section").eq("class", klass).eq("status", "active"),
    sb().from("result_subject_setup").select("*").eq("exam_id", examId).eq("class", klass).order("sort_order"),
    sb().from("result_marks").select("*").eq("exam_id", examId).eq("class", klass),
    sb().from("result_settings").select("*").eq("id", 1).maybeSingle()
  ]);
  const err = st.error || su.error || mk.error || se.error;
  if (err) { showToast(err.message, "error"); $("rTable").innerHTML = ""; return; }
  settings = se.data || {};
  subjects = su.data || [];
  if (!subjects.length) { $("rTable").innerHTML = `<div class="empty-state"><div class="icon">📝</div><p>No subject setup for this class in this exam.</p></div>`; $("rActions").style.display = "none"; $("rStatus").innerHTML = ""; $("rStats").textContent = ""; return; }

  students = (st.data || []).sort((a, b) => (parseInt(a.roll_no) || 99999) - (parseInt(b.roll_no) || 99999) || a.name.localeCompare(b.name));
  const mm = {}; (mk.data || []).forEach(m => mm[m.student_reg_no + "|" + m.subject_name] = m);

  // completeness
  incomplete = subjects.map(s => {
    const c = students.filter(x => mm[x.reg_no + "|" + s.subject_name]).length;
    return c < students.length ? `${s.subject_name} (${c}/${students.length})` : null;
  }).filter(Boolean);
  $("rStatus").innerHTML = incomplete.length
    ? `<div class="rs-warn"><b>Marks still pending:</b> ${incomplete.map(escapeHtml).join(", ")}. Missing marks are treated as AB (absent) until teachers submit them.</div>` : "";

  records = students.map((s, idx) => {
    const marks = {}; let grand = 0, maxMarks = 0, anyD = false;
    subjects.forEach(sub => {
      const m = mm[s.reg_no + "|" + sub.subject_name];
      const w = m ? (m.written_ab || m.written === null ? "AB" : Number(m.written)) : "AB";
      const o = !sub.has_oral ? "NA" : (m ? (m.oral_ab || m.oral === null ? "AB" : Number(m.oral)) : "AB");
      const wn = typeof w === "number" ? w : 0, on = typeof o === "number" ? o : 0;
      const tot = wn + on;
      const fullTot = Number(sub.written_full) + (sub.has_oral ? Number(sub.oral_full) : 0);
      const [g] = gradeAndRemark(fullTot > 0 ? tot / fullTot * 100 : 0);
      marks[sub.subject_name] = { written: w, oral: o, total: tot, grade: g, full_w: Number(sub.written_full),
        full_o: sub.has_oral ? Number(sub.oral_full) : "NA", full_tot: fullTot, exclude: sub.exclude_from_total };
      if (!sub.exclude_from_total) { maxMarks += fullTot; grand += tot; if (g === "D") anyD = true; }
    });
    const pct = maxMarks > 0 ? n1(grand / maxMarks * 100) : 0;
    const [grade, remark] = gradeAndRemark(pct);
    let result = "Pass";
    if (settings.pass_rule === "fail_any_d" && anyD) result = "Fail";
    if (settings.pass_rule === "fail_below_pct" && pct < Number(settings.pass_cutoff || 0)) result = "Fail";
    return { reg: s.reg_no, roll: s.roll_no || idx + 1, name: s.name, klass, section: s.section || "", marks,
      grand_total: n1(grand), max_mark: maxMarks, percentage: pct, overall_grade: grade, remark, result };
  });

  const highest = records.length ? Math.max(...records.map(r => r.grand_total)) : 0;
  records.sort((a, b) => b.grand_total - a.grand_total);        // stable: ties keep roll order (same as app.py)
  records.forEach((r, i) => { r.rank = i + 1; r.highest = highest; });
  renderTable();
}

function renderTable() {
  $("rActions").style.display = records.length ? "flex" : "none";
  $("rStats").textContent = `Total Students: ${records.length} | Class Highest: ${records.length ? records[0].highest : 0}`;
  if (!records.length) { $("rTable").innerHTML = `<div class="empty-state"><div class="icon">🎓</div><p>No active students in this class.</p></div>`; return; }
  $("rTable").innerHTML = `<div class="table-wrap"><table class="data"><thead><tr>
    <th>Rank</th><th>Roll</th><th>Name</th><th>Grand Total</th><th>Max Mark</th><th>%</th><th>Grade</th><th>Remark</th><th>Result</th><th></th></tr></thead><tbody>` +
    records.map((r, i) => `<tr><td>${r.rank}</td><td>${escapeHtml(String(r.roll))}</td><td>${escapeHtml(r.name)}</td>
      <td>${r.grand_total}</td><td>${r.max_mark}</td><td>${r.percentage}%</td><td>${r.overall_grade}</td><td>${r.remark}</td>
      <td class="${r.result === "Fail" ? "rs-fail" : ""}">${r.result}</td>
      <td><button class="btn btn-ghost btn-sm" data-i="${i}">PDF</button></td></tr>`).join("") + `</tbody></table></div>`;
  $("rTable").querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => {
    const r = records[+b.dataset.i];
    downloadSheets([r], `MarkSheet_Roll_${r.roll}_${r.name.replace(/\s+/g, "_")}.pdf`);
  }));
}

function checkIncomplete() {
  return !incomplete.length || confirm(`Marks are still pending for: ${incomplete.join(", ")}.\n\nPending marks will print as AB. Continue?`);
}

/* ===================== IMAGES ===================== */
function loadImg(dataUrl) {
  return new Promise(res => {
    if (!dataUrl) return res(null);
    const im = new Image();
    im.onload = () => res({ data: dataUrl, w: im.naturalWidth, h: im.naturalHeight, fmt: /image\/jpe?g/i.test(dataUrl) ? "JPEG" : "PNG" });
    im.onerror = () => res(null);
    im.src = dataUrl;
  });
}
function drawFit(doc, img, cx, cy, bw, bh) {         // centred, aspect ratio kept
  const s = Math.min(bw / img.w, bh / img.h), w = img.w * s, h = img.h * s;
  doc.addImage(img.data, img.fmt, cx - w / 2, cy - h / 2, w, h);
}

/* ===================== MARK SHEET PDF (layout mirrors app.py) ===================== */
const IN = 72;                                         // reportlab inch → points
function drawSheet(doc, st, ctx) {
  const W = doc.internal.pageSize.getWidth();
  const x0 = (W - 7.4 * IN) / 2, FW = 7.4 * IN;
  const navy = [22, 35, 70];

  // ---- header: board logo | school block | school logo
  // ---- page border (outer thick + inner thin)
  const PH = doc.internal.pageSize.getHeight();
  doc.setDrawColor(22, 35, 70); doc.setLineWidth(2); doc.rect(12, 12, W - 24, PH - 24);
  doc.setLineWidth(0.6); doc.rect(17, 17, W - 34, PH - 34);
  doc.setDrawColor(0);

  const top = 30, rowH = 1.1 * IN + 6;
  const bx = x0 + 0.65 * IN, sx = x0 + FW - 0.65 * IN, cy = top + rowH / 2;
  doc.setTextColor(0); doc.setFont("helvetica", "bold");
  if (ctx.board) drawFit(doc, ctx.board, bx, cy, 1.1 * IN, 1.1 * IN); else { doc.setFontSize(11); doc.text("BOARD", bx, cy + 4, { align: "center" }); }
  if (ctx.school) drawFit(doc, ctx.school, sx, cy, 1.1 * IN, 1.1 * IN); else { doc.setFontSize(11); doc.text("SCHOOL", sx, cy + 4, { align: "center" }); }

  const mid = W / 2, t0 = cy - 34;
  const nm = ctx.settings.school_name || "";
  doc.setFont("Rye", "normal");
  let nfs = 24; doc.setFontSize(nfs);
  while (nfs > 12 && doc.getTextWidth(nm) > 4.85 * IN) { nfs -= 0.5; doc.setFontSize(nfs); }
  doc.text(nm, mid, t0 + 19, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text(`Regd. No: ${ctx.settings.regd_no || ""}`, mid, t0 + 35, { align: "center" });
  doc.text(ctx.settings.address || "", mid, t0 + 47, { align: "center", maxWidth: 4.8 * IN });
  doc.setFont("helvetica", "bold"); doc.setFontSize(11);
  doc.text(ctx.exam.name, mid, t0 + 65, { align: "center", maxWidth: 4.8 * IN });

  // ---- title
  let y = top + rowH + 8;
  doc.setFontSize(15); doc.text("Mark Sheet", mid, y + 14, { align: "center" });
  y += 18 + 10;

  // ---- student info: Name | Reg No  /  Class | Section | Roll
  const lv = (label, value, x, yy, align) => {
    doc.setFontSize(10);
    doc.setFont("helvetica", "bold"); const lw = doc.getTextWidth(label + " ");
    doc.setFont("helvetica", "normal"); const vw = doc.getTextWidth(String(value));
    const start = align === "left" ? x : align === "center" ? x - (lw + vw) / 2 : x - (lw + vw);
    doc.setFont("helvetica", "bold"); doc.text(label, start, yy);
    doc.setFont("helvetica", "normal"); doc.text(String(value), start + lw, yy);
  };
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text(`Name: ${st.name}`, x0 + 6, y + 13.5);
  lv("Reg. No:", st.reg || "-", x0 + FW - 6, y + 13.5, "right");
  y += 19.2;
  lv("Class:", classShort(st.klass), x0 + 6, y + 12.5, "left");
  lv("Section:", st.section || "-", x0 + FW / 2, y + 12.5, "center");
  lv("Roll:", st.roll, x0 + FW - 6, y + 12.5, "right");
  y += 18 + 10;

  // ---- marks table
  const n = ctx.subjects.length;
  const [pad, fs] = n <= 6 ? [7.5, 9.5] : n <= 8 ? [5.5, 9] : [3, 8.5];
  const body = ctx.subjects.map(s => {
    const m = st.marks[s.subject_name];
    return [s.subject_name, show(m.full_w), show(m.full_o), show(m.full_tot), show(m.written), show(m.oral), show(m.total), m.grade];
  });
  const mw = [1.6, .7, .7, .75, .7, .7, .75, .75].map(v => v * IN);
  doc.autoTable({
    startY: y, margin: { left: (W - 6.65 * IN) / 2 }, tableWidth: 6.65 * IN, theme: "grid",
    head: [
      [{ content: "Subject", rowSpan: 2 }, { content: "Full Mark", colSpan: 3 }, { content: "Mark Obtained", colSpan: 3 }, { content: "Grade", rowSpan: 2 }],
      ["Written", "Oral", "Total", "Written", "Oral", "Total"]
    ],
    body,
    styles: { fontSize: fs, halign: "center", valign: "middle", cellPadding: { top: pad, bottom: pad, left: 6, right: 6 }, lineColor: [128, 128, 128], lineWidth: 0.5, textColor: 0 },
    headStyles: { fillColor: navy, textColor: 255, fontStyle: "bold", halign: "center" },
    columnStyles: Object.fromEntries(mw.map((w, i) => [i, { cellWidth: w, ...(i === 0 ? { halign: "left" } : {}) }])),
    didParseCell: d => { if (d.section === "head") d.cell.styles.halign = "center"; }
  });
  y = doc.lastAutoTable.finalY + 10;

  // ---- summary grid 4 x 2
  doc.autoTable({
    startY: y, margin: { left: x0 }, tableWidth: FW, theme: "grid", showHead: false,
    body: [
      [`Grand Total: ${st.grand_total}`, `Total: ${st.max_mark}`, `Highest: ${st.highest}`, `Overall Grade: ${st.overall_grade}`],
      [`Result: ${st.result}`, `Remark: ${st.remark}`, `Percentage: ${st.percentage}%`, `Rank: ${st.rank}`]
    ],
    styles: { fontSize: 9, fontStyle: "bold", halign: "left", cellPadding: 5, lineColor: 0, lineWidth: 0.5, textColor: 0 },
    columnStyles: { 0: { cellWidth: 1.85 * IN }, 1: { cellWidth: 1.85 * IN }, 2: { cellWidth: 1.85 * IN }, 3: { cellWidth: 1.85 * IN } }
  });
  y = doc.lastAutoTable.finalY + 12;

  // ---- grade scale legend
  doc.autoTable({
    startY: y, margin: { left: x0 }, tableWidth: FW, theme: "grid", showHead: false,
    body: [
      ["Mark", "90-100", "80-89", "60-79", "45-59", "35-44", "25-34", "Below 25"],
      ["Grade", "AA", "A+", "A", "B+", "B", "C", "D"],
      ["Remark Scale", "Outstanding", "Excellent", "Very Good", "Good", "Satisfactory", "Marginal", "Disqualified"]
    ],
    styles: { fontSize: 7.5, halign: "center", cellPadding: 3, lineColor: [128, 128, 128], lineWidth: 0.5, textColor: 0 },
    columnStyles: { 0: { cellWidth: 1.1 * IN, fontStyle: "bold" }, ...Object.fromEntries([1, 2, 3, 4, 5, 6, 7].map(i => [i, { cellWidth: 0.9 * IN }])) },
    didParseCell: d => { if (d.row.index === 1) d.cell.styles.fontStyle = "bold"; }
  });
  y = doc.lastAutoTable.finalY + 30;

  // ---- signatures
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  const sy = y + 40;
  doc.text(`Publish Date: ${ctx.publish}`, x0 + 6, sy);
  doc.text("Class Teacher's Signature", x0 + 2.5 * IN + 1.25 * IN, sy, { align: "center" });
  if (ctx.sign) drawFit(doc, ctx.sign, x0 + FW - 6 - 0.7 * IN, sy - 20, 1.4 * IN, 0.45 * IN);
  doc.text("Headmaster's Signature", x0 + FW - 6, sy, { align: "right" });
}

async function loadCtx() {
  const [board, school, sign] = await Promise.all([loadImg(settings.board_logo), loadImg(settings.school_logo), loadImg(settings.hm_sign)]);
  return { settings, exam: examObj, subjects, board, school, sign, publish: $("rPublish").value || examObj.publish_date || "" };
}

async function downloadSheets(list, filename) {
  if (!list.length) return;
  if (list.length > 1 && !checkIncomplete()) return;
  const btn = $("rAllPdf"); const old = btn.textContent; btn.disabled = true; btn.textContent = "Generating…";
  try {
    const ctx = await loadCtx();
    const doc = new jspdf.jsPDF({ unit: "pt", format: "a4" });
    initFonts(doc);
    list.forEach((st, i) => { if (i) doc.addPage(); drawSheet(doc, st, ctx); });
    doc.save(filename);
  } catch (e) { console.error(e); showToast("PDF failed: " + e.message, "error"); }
  btn.disabled = false; btn.textContent = old;
}

/* ===================== RANK LIST PDF ===================== */
async function downloadRankList() {
  if (!records.length || !checkIncomplete()) return;
  const doc = new jspdf.jsPDF({ unit: "pt", format: "a4" });
  initFonts(doc);
  const W = doc.internal.pageSize.getWidth();
  const ctx = await loadCtx();
  let y = 40;
  doc.setFont("Rye", "normal"); doc.setFontSize(22); doc.text(settings.school_name || "", W / 2, y, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.setFont("helvetica", "normal"); doc.text(settings.address || "", W / 2, y += 15, { align: "center" });
  doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text(examObj.name, W / 2, y += 20, { align: "center" });
  doc.setFontSize(13); doc.text(`Rank List — ${CLASS_LABELS[$("rClass").value]}`, W / 2, y += 20, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text(`Students: ${records.length}   Highest: ${records[0].highest}   Publish Date: ${ctx.publish}`, W / 2, y += 15, { align: "center" });

  doc.autoTable({
    startY: y + 12, margin: { left: 30, right: 30, bottom: 40 }, theme: "grid",
    head: [["Rank", "Roll", "Reg. No", "Name", "Section", "Grand Total", "Max Mark", "%", "Grade", "Result"]],
    body: records.map(r => [r.rank, r.roll, r.reg || "-", r.name, r.section || "-", r.grand_total, r.max_mark, r.percentage + "%", r.overall_grade, r.result]),
    styles: { fontSize: 9, cellPadding: 4, halign: "center", lineColor: [128, 128, 128], lineWidth: 0.5, textColor: 0 },
    headStyles: { fillColor: [22, 35, 70], textColor: 255, fontStyle: "bold" },
    columnStyles: { 3: { halign: "left", cellWidth: 130 } },
    didDrawPage: d => {
      doc.setFontSize(8); doc.setTextColor(100);
      doc.text(`Page ${doc.internal.getNumberOfPages()}`, W / 2, doc.internal.pageSize.getHeight() - 20, { align: "center" });
      doc.setTextColor(0);
    }
  });
  doc.save(`RankList_${tag()}.pdf`);
}

/* ===================== LEDGER EXCEL ===================== */
function exportLedger() {
  if (!records.length) return;
  const rows = records.map(r => {
    const row = { Rank: r.rank, Roll: r.roll, "Reg No": r.reg, Class: classShort(r.klass), Name: r.name, "Grand Total": r.grand_total, "Max Marks": r.max_mark,
      Percentage: r.percentage + "%", Grade: r.overall_grade, Remark: r.remark, Result: r.result };
    subjects.forEach(s => {
      const m = r.marks[s.subject_name];
      row[s.subject_name + "_W"] = m.written; row[s.subject_name + "_O"] = m.oral;
      row[s.subject_name + "_Tot"] = m.total; row[s.subject_name + "_Gr"] = m.grade;
    });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ledger");
  XLSX.writeFile(wb, `Result_Ledger_${tag()}.xlsx`);
}
