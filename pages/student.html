<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student — Golden Heritage Academy Portal</title>
<link rel="stylesheet" href="../assets/css/common.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<style>
  .st-search { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .st-search .field { flex:1; min-width:220px; margin:0; }
  .st-results { display:grid; gap:8px; margin-top:14px; }
  .st-result { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--ink,#ddd); border-radius:var(--radius-md,8px); }
  .st-result strong { display:block; }
  .st-profile-head { display:flex; align-items:center; gap:18px; margin-bottom:18px; }
  .st-avatar { width:104px; height:104px; flex:0 0 104px; border-radius:50%; overflow:hidden; background:rgba(0,0,0,.07); display:grid; place-items:center; color:var(--ink); font-size:2rem; font-weight:700; }
  .st-avatar img { width:100%; height:100%; object-fit:cover; }
  .st-profile-meta { flex:1; min-width:0; }
  .st-profile-meta h2 { margin:0 0 5px; }
  .st-profile-meta p { margin:4px 0; opacity:.75; }
  .st-profile-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .st-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:10px; margin:16px 0 22px; }
  .st-stat { padding:13px 15px; border:1px solid var(--ink,#ddd); border-radius:var(--radius-md,8px); }
  .st-stat span { display:block; opacity:.7; font-size:.78rem; text-transform:uppercase; }
  .st-stat strong { display:block; font-size:1.2rem; margin-top:4px; }
  .st-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin:0 0 22px; }
  .st-detail { padding:10px 12px; background:rgba(0,0,0,.035); border-radius:8px; min-width:0; }
  .st-detail dt { font-size:.75rem; opacity:.7; margin-bottom:4px; }
  .st-detail dd { margin:0; overflow-wrap:anywhere; }
  .st-section { margin-top:24px; }
  .st-section h3 { margin-bottom:10px; }
  .st-payment-table { min-width:900px; table-layout:fixed; }
  .st-payment-table th:first-child, .st-payment-table td:first-child { width:100px; white-space:nowrap; }
  .st-payment-table th:nth-child(2) { width:150px; }
  .st-payment-table th:nth-child(3) { width:85px; }
  .st-payment-table th:nth-child(4) { width:145px; }
  .st-edit-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 14px; }
  @media(max-width:620px) { .st-edit-grid { grid-template-columns:1fr; } }
  .st-remark-form { display:flex; gap:8px; align-items:flex-start; margin:10px 0 16px; }
  .st-remark-form textarea { flex:1; min-height:76px; resize:vertical; }
  .st-remark { padding:11px 13px; border-left:3px solid var(--brass,#b08d57); background:rgba(0,0,0,.035); margin:8px 0; border-radius:0 8px 8px 0; }
  .st-remark time { display:block; font-size:.78rem; opacity:.68; margin-bottom:4px; }
  .st-placeholder { font-size:2rem; }
  @media(max-width:620px) {
    .st-profile-head { align-items:flex-start; flex-wrap:wrap; }
    .st-avatar { width:82px; height:82px; flex-basis:82px; }
    .st-profile-actions { width:100%; }
    .st-remark-form { flex-direction:column; }
    .st-remark-form textarea { width:100%; }
    .st-result { align-items:flex-start; flex-direction:column; }
  }
</style>
</head>
<body>
<div class="page-wrap enter-up">
  <div class="page-header">
    <span class="eyebrow">Academics</span>
    <h1>Student</h1>
    <p>Search for a student to view their profile, payments, dues, and exam results.</p>
  </div>

  <section class="card">
    <form class="st-search" id="studentSearchForm">
      <div class="field">
        <label for="studentSearch">Student name or Reg No</label>
        <input class="input" id="studentSearch" autocomplete="off" placeholder="Enter a name or registration number" required />
      </div>
      <button class="btn btn-primary" type="submit" id="studentSearchBtn">Search</button>
    </form>
    <div id="searchResults" aria-live="polite"></div>
  </section>

  <section class="card" id="studentProfile" style="display:none; margin-top:18px;"></section>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-stack"></div>
<script>
const PAGE_ID = "student";
let myAccess = null;
let currentStudent = null;
const CLASS_LABELS = {
  "1":"Class 1","2":"Class 2","3":"Class 3","4":"Class 4","5":"Class 5","6":"Class 6",
  "7":"Class 7","8":"Class 8","9":"Class 9","10":"Class 10","11-arts":"Class 11 — Arts",
  "11-science":"Class 11 — Science","12-arts":"Class 12 — Arts","12-science":"Class 12 — Science"
};
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const GRADE_SCALE = [[90,"AA"],[80,"A+"],[60,"A"],[45,"B+"],[35,"B"],[25,"C"],[0,"D"]];
const PHOTO_BUCKET = "student-photos";
const $ = id => document.getElementById(id);
const money = value => "₹" + Number(value || 0).toLocaleString("en-IN", { minimumFractionDigits:2, maximumFractionDigits:2 });
const displayValue = value => value == null || value === "" ? "—" : String(value);

async function init() {
  myAccess = await getMyAccess(PAGE_ID);
  if (!myAccess.profile || !myAccess.canView) return;
  $("studentSearchForm").addEventListener("submit", searchStudents);
}

async function fetchAll(makeQuery) {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await makeQuery().range(from, from + 999);
    if (error) throw error;
    rows.push(...(data || []));
    if (!data || data.length < 1000) return rows;
  }
}

async function searchStudents(event) {
  event.preventDefault();
  const term = $("studentSearch").value.trim();
  if (!term) return;
  const button = $("studentSearchBtn");
  button.disabled = true;
  $("searchResults").innerHTML = '<div class="skeleton" style="height:18px;margin-top:14px"></div>';
  $("studentProfile").style.display = "none";
  try {
    const [byName, byReg] = await Promise.all([
      supabaseClient.from("student_master").select("reg_no,name,father_name,class,status,mobile_no")
        .ilike("name", `%${term}%`).order("name").limit(25),
      supabaseClient.from("student_master").select("reg_no,name,father_name,class,status,mobile_no")
        .ilike("reg_no", `%${term}%`).order("name").limit(25)
    ]);
    if (byName.error) throw byName.error;
    if (byReg.error) throw byReg.error;
    const matches = new Map();
    [...(byName.data || []), ...(byReg.data || [])].forEach(student => matches.set(student.reg_no, student));
    const students = [...matches.values()].sort((a,b) => a.name.localeCompare(b.name));
    renderSearchResults(students);
  } catch (error) {
    $("searchResults").innerHTML = `<div class="field-error show">${escapeHtml(error.message || String(error))}</div>`;
  } finally {
    button.disabled = false;
  }
}

function renderSearchResults(students) {
  if (!students.length) {
    $("searchResults").innerHTML = `<div class="empty-state" style="margin-top:14px"><p>No matching students found.</p></div>`;
    return;
  }
  $("searchResults").innerHTML = `<div class="st-results">${students.map(student => `
    <div class="st-result">
      <div><strong>${escapeHtml(student.name)} · ${escapeHtml(student.reg_no)}</strong>
        <span>${escapeHtml(CLASS_LABELS[student.class] || student.class)} · ${escapeHtml(student.father_name || "—")} · ${escapeHtml(student.mobile_no || "—")}</span>
      </div>
      <button class="btn btn-ghost btn-sm" type="button" data-student-reg="${escapeHtml(student.reg_no)}">View profile</button>
    </div>`).join("")}</div>`;
  $("searchResults").querySelectorAll("[data-student-reg]").forEach(button => {
    button.addEventListener("click", () => loadStudentProfile(button.dataset.studentReg));
  });
}

async function loadStudentProfile(regNo) {
  const profile = $("studentProfile");
  profile.style.display = "block";
  profile.innerHTML = '<div class="skeleton" style="height:30px"></div>';
  profile.scrollIntoView({ behavior:"smooth", block:"start" });
  try {
    const { data: student, error: studentError } = await supabaseClient.from("student_master")
      .select("*").eq("reg_no", regNo).single();
    if (studentError) throw studentError;
    currentStudent = student;
    const [feeMaster, receipts, remarks, examData] = await Promise.all([
      fetchAll(() => supabaseClient.from("fee_master").select("*").eq("student_reg_no", regNo).order("recorded_at", { ascending:true })),
      fetchAll(() => supabaseClient.from("fee_receipts").select("*").eq("student_reg_no", regNo).order("recorded_at", { ascending:false })),
      fetchAll(() => supabaseClient.from("student_profile_remarks").select("*").eq("student_reg_no", regNo).order("recorded_at", { ascending:false })),
      loadExamPercentages(student)
    ]);
    const feeSummary = calculateFeeSummary(student, feeMaster, receipts);
    renderProfile(student, feeMaster, receipts, remarks, examData, feeSummary);
    if (student.photo_path) loadProfilePhoto(student.photo_path, profile);
  } catch (error) {
    profile.innerHTML = `<div class="field-error show">Could not load student profile: ${escapeHtml(error.message || String(error))}</div>`;
  }
}

async function loadProfilePhoto(path, profile) {
  const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrl(path, 3600);
  if (error) {
    const note = document.createElement("small");
    note.className = "field-error show";
    note.textContent = `Profile image could not be loaded: ${error.message}`;
    profile.querySelector(".st-profile-head")?.after(note);
    return;
  }
  const image = profile.querySelector("#studentProfileImage");
  if (image) {
    image.src = data.signedUrl;
    image.hidden = false;
    image.onload = () => profile.querySelector(".st-placeholder").hidden = true;
  }
}

function receiptTotal(receipt) {
  return Number(receipt.amount_cash || 0) + Number(receipt.amount_bank || 0) +
    Number(receipt.amount_phonepe || 0) + Number(receipt.discount || 0);
}

function currentSessionForClass(klass, date = new Date()) {
  const year = date.getFullYear();
  if (parseInt(klass, 10) >= 10) {
    const start = date.getMonth() >= 3 ? year : year - 1;
    return `${start}-${String(start + 1).slice(-2)}`;
  }
  return String(year);
}

function sessionMonthKeys(klass, session) {
  const months = [];
  if (parseInt(klass, 10) >= 10) {
    const startYear = Number(String(session).slice(0,4));
    for (let m=4; m<=12; m++) months.push(`${startYear}-${String(m).padStart(2,"0")}`);
    for (let m=1; m<=3; m++) months.push(`${startYear+1}-${String(m).padStart(2,"0")}`);
  } else {
    const year = Number(session);
    for (let m=1; m<=12; m++) months.push(`${year}-${String(m).padStart(2,"0")}`);
  }
  return months;
}

function monthlyDueForSession(student, rates, receipts, session, today) {
  const months = sessionMonthKeys(student.class, session);
  const ledger = Object.fromEntries(months.map(key => {
    const [year, month] = key.split("-").map(Number);
    const monthEnd = new Date(year, month, 0);
    const monthEndTime = new Date(year, month, 0, 23,59,59);
    let rate = rates.length ? Number(rates[0].amount) : 0;
    rates.forEach(row => { if (new Date(row.recorded_at) <= monthEndTime) rate = Number(row.amount); });
    const startDate = new Date(student.reactivated_at || student.admission_date);
    const endDate = student.status === "deactivated" && student.deactivate_date ? new Date(student.deactivate_date) : today;
    const sessionStart = new Date(Number(months[0].slice(0,4)), Number(months[0].slice(5,7))-1, 1);
    const activeStart = startDate > sessionStart ? startDate : sessionStart;
    const billed = monthEnd >= activeStart && new Date(year, month-1, 1) <= endDate;
    return [key, { rate, paid:0, billed }];
  }));
  let pool = 0;
  receipts.filter(row => (row.target_session || session) === session).forEach(row => {
    let remaining = receiptTotal(row);
    const selectedMonths = Array.isArray(row.for_months) ? row.for_months : [];
    if (!selectedMonths.length) { pool += remaining; return; }
    selectedMonths.forEach(key => {
      if (!ledger[key] || remaining <= 0) return;
      const applied = Math.min(Math.max(0, ledger[key].rate - ledger[key].paid), remaining);
      ledger[key].paid += applied;
      remaining -= applied;
    });
  });
  let due = 0;
  months.forEach(key => {
    const row = ledger[key];
    if (row.billed && pool > 0) {
      const applied = Math.min(Math.max(0, row.rate - row.paid), pool);
      row.paid += applied;
      pool -= applied;
    }
    if (row.billed) due += Math.max(0, row.rate - row.paid);
  });
  return due;
}

function calculateFeeSummary(student, feeMaster, receipts) {
  const currentSession = student.academic_session || currentSessionForClass(student.class);
  const sessions = [...new Set([
    ...(student.previous_sessions || []), currentSession,
    ...feeMaster.map(row => row.academic_session), ...receipts.map(row => row.target_session)
  ].filter(Boolean))];
  const today = new Date();
  let due = 0;
  sessions.forEach(session => {
    const historical = session !== currentSession;
    const sessionFees = feeMaster.filter(row => !row.academic_session || row.academic_session === session);
    const sessionReceipts = receipts.filter(row => !row.target_session || row.target_session === session);
    const monthlyRates = sessionFees.filter(row => row.type === "monthly").sort((a,b) => new Date(a.recorded_at)-new Date(b.recorded_at));
    const monthlyReceipts = sessionReceipts.filter(row => row.fee_type === "monthly");
    due += monthlyDueForSession({
      ...student,
      academic_session:session,
      reactivated_at:historical ? null : student.reactivated_at,
      status:historical && student.deactivate_date ? "deactivated" : student.status
    }, monthlyRates, monthlyReceipts, session, today);
    const admissionCharges = sessionFees.filter(row => row.type === "admission" || row.type === "readmission")
      .reduce((sum,row) => sum + Number(row.amount || 0), 0);
    const admissionPaid = sessionReceipts.filter(row => row.fee_type === "admission_readmission")
      .reduce((sum,row) => sum + receiptTotal(row), 0);
    due += Math.max(0, admissionCharges - admissionPaid);
  });

  const currentFees = feeMaster.filter(row => !row.academic_session || row.academic_session === currentSession);
  const latest = type => currentFees.filter(row => row.type === type).sort((a,b) => new Date(b.recorded_at)-new Date(a.recorded_at))[0];
  return {
    currentSession,
    admissionFee: currentFees.filter(row => row.type === "admission" || row.type === "readmission")
      .sort((a,b) => new Date(b.recorded_at)-new Date(a.recorded_at))[0],
    monthlyFee: latest("monthly"),
    paid: receipts.reduce((sum,row) => sum + receiptTotal(row), 0),
    due
  };
}

async function loadExamPercentages(student) {
  const [exams, setups, marks] = await Promise.all([
    supabaseClient.from("result_exams").select("id,name,created_at").order("created_at", { ascending:false }),
    supabaseClient.from("result_subject_setup").select("*").eq("class", student.class),
    supabaseClient.from("result_marks").select("*").eq("student_reg_no", student.reg_no)
  ]);
  const error = exams.error || setups.error || marks.error;
  if (error) return { rows:[], error:error.message };
  const setupsByExam = new Map();
  (setups.data || []).forEach(row => {
    if (!setupsByExam.has(row.exam_id)) setupsByExam.set(row.exam_id, []);
    setupsByExam.get(row.exam_id).push(row);
  });
  const marksByExamSubject = new Map((marks.data || []).map(row => [`${row.exam_id}|${row.subject_name}`, row]));
  const rows = (exams.data || []).map(exam => {
    const subjects = (setupsByExam.get(exam.id) || []).filter(subject => !subject.exclude_from_total);
    if (!subjects.length) return null;
    let total = 0, maximum = 0;
    subjects.forEach(subject => {
      const mark = marksByExamSubject.get(`${exam.id}|${subject.subject_name}`);
      const written = mark && !mark.written_ab && mark.written != null ? Number(mark.written) : 0;
      const oral = subject.has_oral && mark && !mark.oral_ab && mark.oral != null ? Number(mark.oral) : 0;
      total += written + oral;
      maximum += Number(subject.written_full || 0) + (subject.has_oral ? Number(subject.oral_full || 0) : 0);
    });
    return maximum ? { name:exam.name, created_at:exam.created_at, percentage:Math.round(total / maximum * 1000) / 10 } : null;
  }).filter(Boolean);
  return { rows, error:null };
}

function renderProfile(student, feeMaster, receipts, remarks, examData, feeSummary) {
  const profile = $("studentProfile");
  const studentDetails = [
    ["Registration No", student.reg_no], ["Student name", student.name], ["Father's name", student.father_name],
    ["Mobile number", student.mobile_no], ["Class", CLASS_LABELS[student.class] || student.class],
    ["Academic session", student.academic_session], ["Admission date", student.admission_date],
    ["Status", student.status], ["Gender", student.gender], ["Section", student.section], ["Roll number", student.roll_no],
    ["Readmission", student.is_readmission ? "Yes" : "No"], ["Previous sessions", (student.previous_sessions || []).join(", ")],
    ["Remark on student record", student.remark], ["Recorded at", student.recorded_at ? formatDateTime(student.recorded_at) : null],
    ["Deactivation date", student.deactivate_date], ["Reactivation date", student.reactivated_at],
    ["Last updated", student.updated_at ? formatDateTime(student.updated_at) : null]
  ];
  const latestCharges = feeMaster.filter(row => row.type === "admission" || row.type === "readmission")
    .sort((a,b) => new Date(b.recorded_at)-new Date(a.recorded_at));
  const latestMonthlyRows = feeMaster.filter(row => row.type === "monthly")
    .sort((a,b) => new Date(b.recorded_at)-new Date(a.recorded_at));
  const paymentDate = value => {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    return `${String(date.getDate()).padStart(2,"0")}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getFullYear()).slice(-2)}`;
  };
  const paymentMonths = values => (values || []).map(value => {
    const match = String(value).match(/^(\d{4})-(\d{1,2})$/);
    if (!match) return String(value);
    const month = Number(match[2]);
    return month >= 1 && month <= 12
      ? `${MONTH_NAMES[month-1]}-${match[1].slice(-2)}`
      : String(value);
  }).join(", ") || "—";
  const imagePlaceholder = `<span class="st-placeholder">${escapeHtml((student.name || "?").trim().charAt(0).toUpperCase())}</span>`;
  profile.innerHTML = `
    <div class="st-profile-head">
      <div class="st-avatar">${imagePlaceholder}<img id="studentProfileImage" alt="${escapeHtml(student.name)} profile" hidden /></div>
      <div class="st-profile-meta">
        <h2>${escapeHtml(student.name)}</h2>
        <p>Reg No: ${escapeHtml(student.reg_no)} · ${escapeHtml(CLASS_LABELS[student.class] || student.class)} · ${escapeHtml(student.academic_session || "—")}</p>
        <p>${statusBadge(student.status)}</p>
      </div>
      ${myAccess.canEdit ? `<div class="st-profile-actions"><button class="btn btn-primary" id="editStudentBtn">Edit data</button></div>` : ""}
    </div>
    <div class="st-stats">
      <div class="st-stat"><span>Admission / Readmission fee</span><strong>${money(feeSummary.admissionFee && feeSummary.admissionFee.amount)}</strong></div>
      <div class="st-stat"><span>Monthly fee</span><strong>${money(feeSummary.monthlyFee && feeSummary.monthlyFee.amount)}</strong></div>
      <div class="st-stat"><span>Payments received</span><strong>${money(feeSummary.paid)}</strong></div>
      <div class="st-stat"><span>Total outstanding due</span><strong>${money(feeSummary.due)}</strong></div>
    </div>
    <h3>Student information</h3>
    <dl class="st-detail-grid">${studentDetails.map(([label,value]) => `<div class="st-detail"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(displayValue(value))}</dd></div>`).join("")}</dl>
    <section class="st-section">
      <h3>Fee and payment details</h3>
      <p>Current fee session: <strong>${escapeHtml(feeSummary.currentSession)}</strong>. Due includes monthly and admission/readmission balances across recorded sessions.</p>
      <div class="table-wrap"><table class="data st-payment-table">
        <thead><tr><th>Date</th><th>Fee type</th><th>Session</th><th>Months / Details</th><th>Cash</th><th>Bank</th><th>PhonePe</th><th>Discount</th><th>Remark</th></tr></thead>
        <tbody>${receipts.length ? receipts.map(row => `<tr>
          <td>${escapeHtml(paymentDate(row.recorded_at))}</td>
          <td>${escapeHtml(row.fee_type === "admission_readmission" ? "Admission / Readmission" : row.fee_type)}</td>
          <td>${escapeHtml(row.target_session || "—")}</td>
          <td>${escapeHtml(paymentMonths(row.for_months))}</td>
          <td>${money(row.amount_cash)}</td><td>${money(row.amount_bank)}</td><td>${money(row.amount_phonepe)}</td><td>${money(row.discount)}</td>
          <td>${escapeHtml(row.remark || "")}</td></tr>`).join("") : `<tr><td colspan="9">No payments recorded.</td></tr>`}
        </tbody>
      </table></div>
      <h4>Fee charges</h4>
      <div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Type</th><th>Session</th><th>Amount</th><th>Remark</th></tr></thead>
        <tbody>${feeMaster.length ? feeMaster.map(row => `<tr><td>${escapeHtml(formatDateTime(row.recorded_at))}</td><td>${escapeHtml(row.type)}</td><td>${escapeHtml(row.academic_session || "—")}</td><td>${money(row.amount)}</td><td>${escapeHtml(row.remark || "")}</td></tr>`).join("") : `<tr><td colspan="5">No fee records.</td></tr>`}</tbody>
      </table></div>
    </section>
    <section class="st-section">
      <h3>Exam percentages</h3>
      ${examData.error ? `<div class="field-error show">Exam results unavailable: ${escapeHtml(examData.error)}</div>` : ""}
      ${!examData.error && examData.rows.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Exam</th><th>Percentage</th><th>Grade</th></tr></thead><tbody>${examData.rows.map(row => {
        const grade = GRADE_SCALE.find(([minimum]) => row.percentage >= minimum)?.[1] || "D";
        return `<tr><td>${escapeHtml(row.name)}</td><td>${row.percentage}%</td><td>${grade}</td></tr>`;
      }).join("")}</tbody></table></div>` : !examData.error ? `<p>No exam percentages are available.</p>` : ""}
    </section>
    <section class="st-section">
      <h3>Remark history</h3>
      ${myAccess.canEdit ? `<form class="st-remark-form" id="studentRemarkForm">
        <textarea class="input" id="studentRemarkInput" maxlength="2000" placeholder="Add a remark to the history" required></textarea>
        <button class="btn btn-primary" type="submit">Add remark</button>
      </form>` : ""}
      <div id="studentRemarks">${remarks.length ? remarks.map(row => `<article class="st-remark">
        <time>${escapeHtml(formatDateTime(row.recorded_at))}</time><div>${escapeHtml(row.remark_text)}</div>
      </article>`).join("") : `<p>No remarks have been added.</p>`}</div>
    </section>`;

  if (myAccess.canEdit) {
    $("editStudentBtn").addEventListener("click", () => openStudentEdit(student));
    $("studentRemarkForm").addEventListener("submit", addStudentRemark);
  }
}

function openStudentEdit(student) {
  openModal({
    title:"Edit student data",
    subtitle:"Update student profile information. Existing payment and fee history is shown separately and is not changed here.",
    wide:true,
    bodyHtml:`<div class="st-edit-grid">
      <div class="field"><label>Registration No</label><input class="input" value="${escapeHtml(student.reg_no)}" disabled /></div>
      <div class="field"><label for="edName">Student name</label><input class="input" id="edName" value="${escapeHtml(student.name || "")}" required /></div>
      <div class="field"><label for="edFather">Father's name</label><input class="input" id="edFather" value="${escapeHtml(student.father_name || "")}" required /></div>
      <div class="field"><label for="edMobile">Mobile number</label><input class="input" id="edMobile" value="${escapeHtml(student.mobile_no || "")}" required /></div>
      <div class="field"><label for="edClass">Class</label><select class="input" id="edClass">${Object.entries(CLASS_LABELS).map(([key,label]) => `<option value="${key}" ${key === student.class ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")}</select></div>
      <div class="field"><label for="edSession">Academic session</label><input class="input" id="edSession" value="${escapeHtml(student.academic_session || "")}" required /></div>
      <div class="field"><label for="edAdmissionDate">Admission date</label><input class="input" type="date" id="edAdmissionDate" value="${escapeHtml((student.admission_date || "").slice(0,10))}" required /></div>
      <div class="field"><label for="edStatus">Status</label><select class="input" id="edStatus"><option value="active" ${student.status === "active" ? "selected" : ""}>Active</option><option value="deactivated" ${student.status === "deactivated" ? "selected" : ""}>Deactivated</option></select></div>
      <div class="field"><label for="edGender">Gender</label><select class="input" id="edGender"><option value="">Not set</option><option ${student.gender === "Male" ? "selected" : ""}>Male</option><option ${student.gender === "Female" ? "selected" : ""}>Female</option></select></div>
      <div class="field"><label for="edSection">Section</label><input class="input" id="edSection" value="${escapeHtml(student.section || "")}" /></div>
      <div class="field"><label for="edRoll">Roll number</label><input class="input" id="edRoll" value="${escapeHtml(student.roll_no || "")}" /></div>
      <div class="field"><label for="edPhoto">Profile image (optional)</label><input class="input" type="file" id="edPhoto" accept="image/*" capture="environment" /></div>
      <div class="field" style="grid-column:1/-1"><label for="edRemark">Student record remark</label><input class="input" id="edRemark" value="${escapeHtml(student.remark || "")}" /></div>
    </div>`,
    footHtml:`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveStudentEditBtn">Save changes</button>`,
    onOpen:() => $("saveStudentEditBtn").addEventListener("click", saveStudentEdit)
  });
}

async function compressPhoto(file) {
  if (!file || !file.type.startsWith("image/")) throw new Error("Choose an image file.");
  if (file.size > 15 * 1024 * 1024) throw new Error("Choose an image smaller than 15 MB.");
  let image, releaseImage;
  if (typeof createImageBitmap === "function") {
    image = await createImageBitmap(file);
    releaseImage = () => image.close();
  } else {
    const objectUrl = URL.createObjectURL(file);
    try {
      image = await new Promise((resolve, reject) => {
        const element = new Image();
        element.onload = () => resolve(element);
        element.onerror = () => reject(new Error("This browser could not read the image."));
        element.src = objectUrl;
      });
      releaseImage = () => URL.revokeObjectURL(objectUrl);
    } catch (error) {
      URL.revokeObjectURL(objectUrl);
      throw error;
    }
  }
  const canvas = document.createElement("canvas");
  try {
    const width = image.width || image.naturalWidth;
    const height = image.height || image.naturalHeight;
    const scale = Math.min(1, 1280 / Math.max(width, height));
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    const context = canvas.getContext("2d");
    if (!context) throw new Error("This browser could not process the image.");
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
  } finally {
    releaseImage();
  }
  for (const quality of [0.82,0.68,0.54,0.4]) {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
    if (!blob) throw new Error("Image compression failed.");
    if (blob.size <= 4 * 1024 * 1024) return blob;
  }
  throw new Error("The compressed image is still too large. Choose a smaller image.");
}

async function uploadPhoto(file) {
  const blob = await compressPhoto(file);
  const path = `${myAccess.profile.user_id}/${crypto.randomUUID()}.jpg`;
  const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:"image/jpeg", upsert:false });
  if (error) throw error;
  return path;
}

async function removePhoto(path) {
  if (!path) return null;
  const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).remove([path]);
  return error ? error.message : null;
}

async function saveStudentEdit() {
  const student = currentStudent;
  if (!student) return;
  const button = $("saveStudentEditBtn");
  button.disabled = true;
  let stagedPhoto = null;
  try {
    if (!$("edName").value.trim() || !$("edFather").value.trim() ||
        !$("edMobile").value.trim() || !$("edSession").value.trim() || !$("edAdmissionDate").value) {
      throw new Error("Student name, father's name, mobile number, session and admission date are required.");
    }
    const photoFile = $("edPhoto").files[0] || null;
    if (photoFile) stagedPhoto = await uploadPhoto(photoFile);
    const selectedStatus = $("edStatus").value;
    const selectedSession = $("edSession").value.trim();
    const update = {
      name:$("edName").value.trim(), father_name:$("edFather").value.trim(),
      mobile_no:$("edMobile").value.trim(), class:$("edClass").value,
      academic_session:selectedSession, admission_date:$("edAdmissionDate").value,
      previous_sessions:[...new Set([...(student.previous_sessions || []),
        ...(student.academic_session && student.academic_session !== selectedSession ? [student.academic_session] : [])])]
        .filter(session => session && session !== selectedSession),
      status:$("edStatus").value, gender:$("edGender").value || null,
      section:$("edSection").value.trim() || null, roll_no:$("edRoll").value.trim() || null,
      remark:$("edRemark").value.trim() || null, updated_by:myAccess.profile.user_id
    };
    if (selectedStatus === "deactivated" && student.status !== "deactivated") {
      update.deactivate_date = new Date().toISOString().slice(0,10);
      update.deactivated_by = myAccess.profile.user_id;
      update.deactivated_at = new Date().toISOString();
    } else if (selectedStatus === "active" && student.status === "deactivated") {
      update.reactivated_at = new Date().toISOString().slice(0,10);
    }
    if (stagedPhoto) update.photo_path = stagedPhoto;
    const { data, error } = await supabaseClient.from("student_master").update(update)
      .eq("reg_no", student.reg_no).select("reg_no");
    if (error) throw error;
    if (!data || !data.length) {
      const cleanupError = await removePhoto(stagedPhoto);
      stagedPhoto = null;
      throw new Error("Student update was blocked by row-level security or no matching record was updated." +
        (cleanupError ? ` New image cleanup failed: ${cleanupError}` : ""));
    }
    await logAudit("student_master", student.reg_no, "update", student, update);
    const cleanupError = stagedPhoto ? await removePhoto(student.photo_path) : null;
    closeModal();
    showToast(cleanupError ? `Student saved, but old image deletion failed: ${cleanupError}` : "Student profile updated.", cleanupError ? "error" : "success");
    await loadStudentProfile(student.reg_no);
  } catch (error) {
    if (stagedPhoto) {
      const cleanupError = await removePhoto(stagedPhoto);
      if (cleanupError) error.message += ` New image cleanup failed: ${cleanupError}`;
    }
    showToast("Could not save student: " + (error.message || String(error)), "error");
  } finally {
    button.disabled = false;
  }
}

async function addStudentRemark(event) {
  event.preventDefault();
  if (!currentStudent) return;
  const input = $("studentRemarkInput");
  const text = input.value.trim();
  if (!text) return;
  const button = event.currentTarget.querySelector("button");
  button.disabled = true;
  try {
    const remark = {
      student_reg_no:currentStudent.reg_no,
      remark_text:text,
      recorded_by:myAccess.profile.user_id
    };
    const { error } = await supabaseClient.from("student_profile_remarks").insert(remark);
    if (error) throw error;
    await logAudit("student_profile_remarks", currentStudent.reg_no, "insert", null, remark);
    showToast("Remark added to history.", "success");
    await loadStudentProfile(currentStudent.reg_no);
  } catch (error) {
    showToast("Could not add remark: " + (error.message || String(error)), "error");
    button.disabled = false;
  }
}

init();
</script>
